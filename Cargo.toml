[package]
name = "icu_tool"
version = "1.10.0"
edition = "2024"
authors = ["Benign X", "W-Mai"]
homepage = "https://w-mai.github.io/icu"
repository = "https://github.com/W-Mai/icu"
description = "Image Converter Ultra"
license = "MIT"

[package.metadata.wix]
upgrade-guid = "368D15F1-EADD-452C-9348-A6A487536412"
path-guid = "35F78CC5-7F21-43C4-87B2-157DB5860DEE"
license = false
eula = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "icu"
path = "src/main.rs"

[dependencies]
icu_lib = { version = "1.10.0" }
clap = { version = "4.5.20", features = ["derive", "suggestions"] }
clap_complete = "4.5.1"
egui_plot = "0.36.0"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
png = "0.17"
web-time = "1.1"
log = "0.4.20"
env_logger = "0.11.2"
serde_yaml = "0.9.33"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.149"
rust-i18n = "3.1.5"
sys-locale = "0.3.2"
rfd = "0.17.2"

# native:
[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "__screenshot",
] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
eframe = { version = "0.35", features = [
    "default_fonts",
    "wayland",
    "x11",
    "glow",
    "persistence",
] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.35", features = [
    "default_fonts",
    "glow",
    "persistence"
] }
web-sys = { version = "0.3.70", features = [
    "HtmlAnchorElement",
    "Document",
    "Url",
    "Blob",
    "BlobPropertyBag",
    "Window",
    "HtmlCanvasElement",
    "Element"
] }
js-sys = "0.3.70"
wasm-bindgen-futures = "0.4.58"

[patch.crates-io]
icu_lib = { path = "icu_lib" }

[profile.release]
lto = true
opt-level = 3

[workspace]
members = [
    "icu_lib",
]

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
